<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand Cricket mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#bff3f5; --cyan:#6fd6e0; --deep:#2e8fa8; --line:#3d7f9c;
    --skin:#fde9df; --skin-sh:#f3c4bd; --blush:#ff9fb4; --bark:#f4a99c;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:"Zen Maru Gothic",sans-serif}
  .stage{position:relative;height:100%;overflow:hidden;animation:drift 14s ease-in-out infinite alternate}
  @keyframes drift{to{transform:scale(1.04) translate(-1%,-.5%)}}
  .bg{position:absolute;inset:0;width:100%;height:100%}
  /* bloom + haze, the "memory" overexposure */
  .bloom{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 30% 20%,#fff 0,#fff0 55%),
               radial-gradient(ellipse at 80% 90%,#fffffff0 0,#fff0 40%);
    mix-blend-mode:screen;opacity:.85}
  .vignette{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 120px 40px #ffffffd0}
  .hand{position:absolute;width:min(46vw,260px);filter:drop-shadow(0 6px 10px #2e8fa833)}
  .hand.rival{top:-4%;left:22%;transform:rotate(180deg);animation:bobR 2.6s ease-in-out infinite}
  .hand.you{bottom:-4%;right:22%;animation:bob 2.6s ease-in-out infinite .4s}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes bobR{0%,100%{transform:rotate(180deg)}50%{transform:rotate(180deg) translateY(-6px)}}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font:900 28px/1 "Zen Maru Gothic";letter-spacing:.12em;color:#fff;
    padding:20px 46px;border-radius:999px;border:2px solid #ffffffcc;cursor:pointer;
    background:linear-gradient(#ffffff55,#ffffff22);backdrop-filter:blur(6px);
    text-shadow:0 0 12px var(--deep),0 0 2px var(--deep);
    box-shadow:0 0 30px #ffffffaa,inset 0 0 18px #ffffff88;transition:transform .2s}
  .play:hover{transform:translate(-50%,-50%) scale(1.05)}
  .petal{position:absolute;width:10px;height:7px;border-radius:60% 0;background:#ffd0dc;opacity:.9;
    animation:fall linear infinite}
  @keyframes fall{from{transform:translate(0,-10vh) rotate(0)}to{transform:translate(-30vw,110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="stage">
  <!-- painted backdrop: sky, tree, meadow -->
  <svg class="bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9fdfd"/><stop offset=".6" stop-color="#9fe8ee"/><stop offset="1" stop-color="#7fdccf"/>
      </linearGradient>
      <linearGradient id="bark" x1="0" x2="1">
        <stop offset="0" stop-color="#ffc6b8"/><stop offset=".6" stop-color="#f4a99c"/><stop offset="1" stop-color="#e48f8a"/>
      </linearGradient>
    </defs>
    <rect width="400" height="800" fill="url(#sky)"/>
    <!-- trunk -->
    <path d="M150 800 C165 620 170 470 160 330 L250 330 C240 470 245 620 270 800Z" fill="url(#bark)"/>
    <path d="M200 340 C205 480 200 620 215 800" stroke="#ffe0d8" stroke-width="10" fill="none" opacity=".7"/>
    <!-- canopy, flat cel blobs -->
    <g fill="#5fd0c0">
      <circle cx="60" cy="230" r="110"/><circle cx="210" cy="170" r="140"/><circle cx="360" cy="240" r="110"/>
    </g>
    <g fill="#8fe6d4">
      <circle cx="90" cy="200" r="70"/><circle cx="230" cy="130" r="90"/><circle cx="340" cy="210" r="60"/>
    </g>
    <!-- dappled light -->
    <g fill="#fff" opacity=".55">
      <ellipse cx="185" cy="470" rx="14" ry="22"/><ellipse cx="220" cy="560" rx="10" ry="16"/><ellipse cx="195" cy="650" rx="12" ry="18"/>
    </g>
    <!-- meadow -->
    <path d="M0 640 C120 610 280 620 400 600 L400 800 L0 800Z" fill="#9ff0d8"/>
    <path d="M0 700 C140 670 260 690 400 660 L400 800 L0 800Z" fill="#c8f7e6"/>
    <g>
      <circle cx="40" cy="660" r="9" fill="#ffb8cc"/><circle cx="90" cy="690" r="7" fill="#e7c6ff"/>
      <circle cx="310" cy="650" r="8" fill="#ffb8cc"/><circle cx="360" cy="700" r="10" fill="#fff3a8"/>
      <circle cx="140" cy="730" r="8" fill="#ffd0dc"/><circle cx="270" cy="740" r="9" fill="#e7c6ff"/>
    </g>
  </svg>

  <!-- hand: back of a fist, wrist at bottom; anime cel style -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="fist" viewBox="0 0 200 320">
      <g stroke="var(--line)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M66 320 C66 260 64 220 68 186 L132 186 C136 220 134 260 134 320Z" fill="var(--skin)"/>
        <path d="M112 186 C118 230 120 280 118 320 L134 320 C134 260 136 220 132 186Z" fill="var(--skin-sh)" stroke="none"/>
        <!-- thumb wrapped on the side -->
        <path d="M58 120 C34 124 30 160 48 176 C60 186 78 182 84 168" fill="var(--skin)"/>
        <!-- back of hand -->
        <path d="M54 112 C50 86 62 70 86 68 L120 68 C146 70 154 90 152 118 L148 170 C146 190 130 198 100 198 C72 198 58 190 56 172Z" fill="var(--skin)"/>
        <path d="M120 72 C146 74 152 92 150 118 L146 170 C144 186 132 194 112 196 C126 170 130 120 120 72Z" fill="var(--skin-sh)" stroke="none"/>
        <!-- knuckle row -->
        <path d="M54 92 C56 66 76 58 84 74 C88 56 108 54 112 72 C116 56 136 56 138 76 C150 64 160 82 152 104" fill="var(--skin)"/>
        <path d="M84 76 L86 92 M112 74 L112 90 M138 78 L134 94" fill="none" stroke-width="2.5"/>
      </g>
      <g fill="var(--blush)" opacity=".55">
        <ellipse cx="70" cy="78" rx="9" ry="5"/><ellipse cx="98" cy="70" rx="9" ry="5"/><ellipse cx="125" cy="72" rx="9" ry="5"/>
      </g>
      <ellipse cx="80" cy="120" rx="16" ry="10" fill="#fff" opacity=".7"/>
    </symbol>
  </svg>

  <svg class="hand rival" viewBox="0 0 200 320"><use href="#fist" style="--skin:#f6dcd6;--skin-sh:#e2b2b4"/></svg>
  <svg class="hand you" viewBox="0 0 200 320"><use href="#fist"/></svg>

  <div class="bloom"></div>
  <div class="vignette"></div>
  <span class="petal" style="left:80%;animation-duration:9s"></span>
  <span class="petal" style="left:55%;animation-duration:12s;animation-delay:-4s"></span>
  <span class="petal" style="left:100%;animation-duration:10s;animation-delay:-7s"></span>
  <button class="play">PLAY</button>
</div>
</body>
</html>
